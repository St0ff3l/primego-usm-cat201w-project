version: '3'
services:
  primego-web:
       build: .
    container_name: primego-container
    restart: always
    ports:
           - "18080:8080"
    volumes:
      - ./ROOT.war:/usr/local/tomcat/webapps/ROOT.war
           - /etc/localtime:/etc/localtime:ro
    environment:
      - JAVA_OPTS=-Duser.timezone=Asia/Kuala_Lumpur